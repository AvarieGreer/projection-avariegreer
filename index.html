
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Typography</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="poster">

        <header class="poster-header">
            <span class="dots"></span>
            <h1>CHRISTMAS TYPOGRAPHY</h1>
            <span class="dots"></span>
        </header>

        <section class="poster-content">

            <div class="vertical-title">
                CHRISTMAS<br>TYPOGRAPHY
            </div>

            <div class="hoho-pattern">
                <p>HOHOHOHOHOHOHOHOHO</p>
                <p>OHOHOHOHOHOHOHOHO</p>
                <p>HOHOHOHOHOHOHOHOHO</p>
                <p>OHOHOHOHOHOHOHOHO</p>
                <p>HOHOHOHOHOHOHOHOHO</p>
            </div>

            <div class="happy-holidays">
                HAPPY HOLIDAYS
            </div>

            <div class="holly">
                Have a Holly Jolly
                <span>Christmas!</span>
            </div>

            <div class="merry">
                MERRY <small>and</small> BRIGHT
            </div>

            <div class="night">
                <span>TWAS</span>
                <div>
                    THE<br>
                    NIGHT<br>
                    BEFORE
                </div>
            </div>

            <div class="christmas">
                <span>CHRIS</span>
                <span>TMAS</span>
            </div>

            <div class="vertical-fun">
                Oh what fun!
            </div>

            <div class="deck">
                Deck the halls
            </div>

        </section>

        <footer class="poster-footer">
            AVARIE GREER
        </footer>

    </main>

</body>
</html>
